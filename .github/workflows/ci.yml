name: Firmware CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt ARM GCC, CMake & Ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

    - name: Cấu hình và Biên dịch Firmware (CMake + Ninja)
      run: |
        # 1. Khởi tạo môi trường build với Ninja
        # (Nếu bạn dùng file toolchain riêng cho ARM, hãy thêm -DCMAKE_TOOLCHAIN_FILE=... vào đây)
        cmake -B build -G Ninja 
        
        # 2. Tiến hành build code
        cmake --build build

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-bin
        # Điều chỉnh lại đuôi file nếu cấu hình CMake của bạn sinh ra file .elf hoặc .hex thay vì .bin
        path: build/*.bin